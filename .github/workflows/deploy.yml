name: Deploy API to Hostinger VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: /var/www/aikviss/api
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: APP_DIR
          script_stop: true
          script: |
            set -e
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env missing. Create VPS .env first."
              exit 1
            fi

            git fetch origin
            BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
            git checkout "$BRANCH" 2>/dev/null || git checkout -B main
            git reset --hard "origin/$BRANCH" || git reset --hard origin/main

            npm i --force
            mkdir -p logs

            if pm2 describe aikviss-api > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save
            echo "API deploy OK"
